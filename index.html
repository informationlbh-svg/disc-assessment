// MAIN APP
// ═══════════════════════════════════════════════════════════════════
function DISCApp() {
  const [lang, setLang]     = useState("zh");
  const [stage, setStage]   = useState("welcome");
  const [info, setInfo]     = useState({ name:"", gender:"", age:"", marital:"", edu:"" });
  const [ans, setAns]       = useState({});
  const [qIdx, setQIdx]     = useState(0);
  const [scores, setScores] = useState(null);
  const [errs, setErrs]     = useState({});
  const [copied, setCopied] = useState(false);
  const [showShare, setShowShare] = useState(false);

  const t = T[lang];

  const toggleLang = () => {
    setLang(l => l==="zh" ? "en" : "zh");
    setInfo({ name:"", gender:"", age:"", marital:"", edu:"" });
    setErrs({});
  };

  const validate = () => {
    const e={};
    if (!info.name.trim())                                       e.name    = t.errName;
    if (!info.gender)                                            e.gender  = t.errGender;
    if (!info.age||isNaN(info.age)||+info.age<10||+info.age>99) e.age     = t.errAge;
    if (!info.marital)                                           e.marital = t.errMarital;
    if (!info.edu)                                               e.edu     = t.errEdu;
    setErrs(e); return !Object.keys(e).length;
  };

  const pick = (id, type, idx) => setAns(prev => {
    const cur = prev[id]||{};
    if (type==="most"  && cur.least===idx) return prev;
    if (type==="least" && cur.most===idx)  return prev;
    return { ...prev, [id]:{ ...cur, [type]:idx } };
  });

  const done = id => { const a=ans[id]; return a && a.most!==undefined && a.least!==undefined; };

  const SHEET_URL = "https://script.google.com/macros/s/AKfycbxK6Z3QWRJ_yUR6Y6DHakhrBfFRqwQ-gncO8e5MIwf0tD-IGiH1Pj-s8KfKXJJzeBZr/exec";

  const calc = () => {
    const M={D:0,I:0,S:0,C:0}, L={D:0,I:0,S:0,C:0}, map={1:"D",2:"I",3:"S",4:"C"};
    Q.forEach(q => {
      const a=ans[q.id]; if(!a) return;
      if(a.most!==undefined)  { const d=map[q.phrases[a.most].mv];  if(d) M[d]++; }
      if(a.least!==undefined) { const d=map[q.phrases[a.least].lv]; if(d) L[d]++; }
    });

    const sorted = Object.entries(M).sort((a,b)=>b[1]-a[1]);
    const pri = sorted[0][0], sec = sorted[1][0];
    const ck = `${pri}${sec}`;
    const comboZh = (COMBO[ck]||COMBO[`${sec}${pri}`]||{}).zh || "";

    const params = new URLSearchParams({
      name:    info.name,
      gender:  info.gender,
      age:     info.age,
      marital: info.marital,
      edu:     info.edu,
      primary: pri,
      secondary: sec,
      combo:   comboZh,
      MD: M.D, MI: M.I, MS: M.S, MC: M.C,
      LD: L.D, LI: L.I, LS: L.S, LC: L.C,
    });

    fetch(`${SHEET_URL}?${params.toString()}`, {
      method: "GET",
      mode: "no-cors",
    }).catch(()=>{});

    setScores({M,L}); setStage("results");
  };

  const norm = () => scores ? { D:scores.M.D, I:scores.M.I, S:scores.M.S, C:scores.M.C } : null;
  const primary   = () => { const n=norm(); return n ? Object.entries(n).sort((a,b)=>b[1]-a[1])[0][0] : "D"; };
  const secondary = () => { const n=norm(); return n ? Object.entries(n).sort((a,b)=>b[1]-a[1])[1][0] : "I"; };

  const shareWA = (resultText) => {
    const url = window.location.href;
    const msg = lang==="zh"
      ? `我刚完成了 DISC 行为风格测评！\n我的类型：${resultText}\n\n想了解你的类型吗？点击链接：\n${url}`
      : `I just completed the DISC Behavioural Style Assessment!\nMy type: ${resultText}\n\nFind out yours here:\n${url}`;
    window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`, '_blank');
    setShowShare(false);
  };

  const shareCopy = () => {
    const url = window.location.href;
    navigator.clipboard.writeText(url).then(()=>{ setCopied(true); setTimeout(()=>setCopied(false),2500); });
    setShowShare(false);
  };

  const sharePrint = () => {
    setShowShare(false);
    setTimeout(()=>window.print(), 300);
  };

  const shareGeneral = () => setShowShare(true);
  const restart = () => { setStage("welcome"); setAns({}); setScores(null); setQIdx(0); setInfo({name:"",gender:"",age:"",marital:"",edu:""}); setShowShare(false); };

  if(stage==="welcome") return <Welcome t={t} onToggleLang={toggleLang} onStart={()=>setStage("info")} onShare={()=>shareWA("DISC Assessment")} copied={copied}/>;
  if(stage==="info")    return <InfoForm t={t} info={info} setInfo={setInfo} errs={errs} onToggleLang={toggleLang} onBack={()=>setStage("welcome")} onNext={()=>{ if(validate()){ setStage("quiz"); setQIdx(0); } }}/>;
  if(stage==="quiz")    return (
    <Quiz t={t} lang={lang} q={Q[qIdx]} num={qIdx+1} total={Q.length} ans={ans[Q[qIdx].id]||{}}
      onPick={(type,i)=>pick(Q[qIdx].id,type,i)}
      onNext={()=>{ if(!done(Q[qIdx].id)){alert(t.alertQ);return;} qIdx<Q.length-1?setQIdx(qIdx+1):calc(); }}
      onPrev={()=>{ if(qIdx>0) setQIdx(qIdx-1); }} isLast={qIdx===Q.length-1}
    />
  );
  if(stage==="results") return (
    <Report t={t} lang={lang} info={info} scores={scores} primary={primary()} secondary={secondary()}
      onRestart={restart} onShare={shareGeneral} onShareWA={shareWA} onCopy={shareCopy} onPrint={sharePrint}
      showShare={showShare} setShowShare={setShowShare} copied={copied}
    />
  );
}

// ═══════════════════════════════════════════════════════════════════
// SCREEN: Welcome
// ═══════════════════════════════════════════════════════════════════
function Welcome({ t, onToggleLang, onStart, onShare, copied }) {
  return (
    <div style={{ ...St.page, background:"linear-gradient(160deg,#0f172a 0%,#1e3a5f 60%,#0f3460 100%)", display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", padding:"28px 20px", position:"relative" }}>
      <LangBtn label={t.langBtn} onToggle={onToggleLang} light />
      <div style={{ textAlign:"center", marginBottom:"32px" }}>
        <div style={{ fontSize:"60px", marginBottom:"12px" }}>🧠</div>
        <h1 style={{ fontSize:"32px", fontWeight:"900", color:"#fff", margin:0, letterSpacing:"3px" }}>DISC</h1>
        <p style={{ fontSize:"13px", color:"rgba(255,255,255,0.6)", margin:"6px 0 0 0", letterSpacing:"1.5px" }}>{t.appSub}</p>
        <div style={{ width:"64px", height:"4px", background:"linear-gradient(90deg,#DC2626,#D97706,#059669,#2563EB)", margin:"14px auto 0", borderRadius:"2px" }}/>
      </div>
      <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:"10px", width:"100%", maxWidth:"320px", marginBottom:"28px" }}>
        {["D","I","S","C"].map(k=>{
          const p=PROFILES[k];
          return (
            <div key={k} style={{ background:"rgba(255,255,255,0.07)", border:`1.5px solid ${p.color}55`, borderRadius:"12px", padding:"14px 12px", textAlign:"center" }}>
              <div style={{ fontSize:"22px", fontWeight:"900", color:p.color }}>{k}</div>
              <div style={{ fontSize:"11px", fontWeight:"700", color:"#f1f5f9", marginTop:"3px" }}>{p.tagline.zh.split(" · ")[0]}</div>
              <div style={{ fontSize:"10px", color:"rgba(255,255,255,0.4)", marginTop:"2px" }}>{p.tagline.en.split(" · ")[0]}</div>
            </div>
          );
        })}
      </div>
      <div style={{ background:"rgba(255,255,255,0.06)", borderRadius:"14px", padding:"18px", width:"100%", maxWidth:"360px", marginBottom:"28px" }}>
        <p style={{ color:"rgba(255,255,255,0.78)", fontSize:"13px", lineHeight:"1.8", margin:0, textAlign:"center" }}>
          {t.appDesc}<br/><br/>
          📋 <strong style={{ color:"#fff" }}>{t.questions}</strong> · ⏱ <strong style={{ color:"#fff" }}>{t.duration}</strong>
        </p>
      </div>
      <div style={{ width:"100%", maxWidth:"320px" }}>
        <button onClick={onStart} style={{ ...St.btn("linear-gradient(135deg,#DC2626,#B91C1C)"), letterSpacing:"0.5px" }}>{t.start}</button>
        <button onClick={onShare} style={{ ...St.btn("transparent","rgba(255,255,255,0.6)"), border:"1px solid rgba(255,255,255,0.2)" }}>{copied ? t.copied : t.share}</button>
      </div>
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════════
// SCREEN: Info Form
// ═══════════════════════════════════════════════════════════════════
function InfoForm({ t, info, setInfo, errs, onBack, onNext, onToggleLang }) {
  const upd = (k,v) => setInfo(p=>({...p,[k]:v}));
  const chips = (key, opts) => (
    <div style={{ display:"flex", flexWrap:"wrap", gap:"8px" }}>
      {opts.map(o=>(
        <button key={o} onClick={()=>upd(key,o)} style={{
          padding:"8px 16px", borderRadius:"20px", fontSize:"13px", cursor:"pointer",
          border:"2px solid", borderColor: info[key]===o ? "#DC2626":"#E5E7EB",
          background: info[key]===o ? "#FEF2F2":"#fff",
          color:      info[key]===o ? "#DC2626":"#6B7280",
          fontWeight: info[key]===o ? "700":"400",
        }}>{o}</button>
      ))}
    </div>
  );
  const field = (label, key, isText=false) => (
    <div style={{ marginBottom:"20px" }}>
      <label style={{ display:"block", fontSize:"14px", fontWeight:"600", color:"#374151", marginBottom:"8px" }}>{label}</label>
      {isText
        ? <input type={key==="age"?"number":"text"} value={info[key]} onChange={e=>upd(key,e.target.value)}
            placeholder={key==="name"?t.namePH:t.agePH}
            style={{ width:"100%", padding:"12px 14px", border:`2px solid ${errs[key]?"#DC2626":"#E5E7EB"}`, borderRadius:"10px", fontSize:"15px", boxSizing:"border-box", outline:"none" }}
          />
        : chips(key, t[key]||[])
      }
      {errs[key] && <p style={{ color:"#DC2626", fontSize:"12px", margin:"5px 0 0 0" }}>{errs[key]}</p>}
    </div>
  );
  return (
    <div style={{ ...St.page, background:"#F9FAFB" }}>
      <div style={{ background:"linear-gradient(135deg,#1a1a2e,#0f3460)", padding:"20px 20px 24px", position:"relative" }}>
        <LangBtn label={t.langBtn} onToggle={onToggleLang} light />
        <button onClick={onBack} style={{ background:"none", border:"none", color:"rgba(255,255,255,0.6)", fontSize:"14px", cursor:"pointer", padding:0, marginBottom:"10px" }}>{t.back}</button>
        <h2 style={{ color:"#fff", margin:0, fontSize:"20px", fontWeight:"700" }}>{t.infoTitle}</h2>
        <p  style={{ color:"rgba(255,255,255,0.5)", margin:"4px 0 0 0", fontSize:"12px" }}>{t.infoSub}</p>
      </div>
      <div style={{ padding:"24px 20px", maxWidth:"480px", margin:"0 auto" }}>
        {field(t.nameLabel,    "name",    true)}
        {field(t.genderLabel,  "gender")}
        {field(t.ageLabel,     "age",     true)}
        {field(t.maritalLabel, "marital")}
        {field(t.eduLabel,     "edu")}
        <button onClick={onNext} style={{ ...St.btn("linear-gradient(135deg,#DC2626,#B91C1C)"), marginTop:"8px" }}>{t.next}</button>
      </div>
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════════
// SCREEN: Quiz
// ═══════════════════════════════════════════════════════════════════
function Quiz({ t, lang, q, num, total, ans, onPick, onNext, onPrev, isLast }) {
  const pct = Math.round((num-1)/total*100);
  return (
    <div style={{ ...St.page, background:"#F9FAFB" }}>
      <div style={{ background:"#fff", borderBottom:"1px solid #F3F4F6", padding:"14px 18px" }}>
        <div style={{ display:"flex", justifyContent:"space-between", marginBottom:"10px" }}>
          <span style={{ fontSize:"13px", color:"#9CA3AF" }}>{t.qOf.replace("{n}",num).replace("{t}",total)}</span>
          <span style={{ fontSize:"13px", fontWeight:"600", color:"#374151" }}>{pct}%</span>
        </div>
        <div style={{ height:"6px", background:"#F3F4F6", borderRadius:"3px" }}>
          <div style={{ height:"100%", width:`${pct}%`, background:"linear-gradient(90deg,#DC2626,#D97706)", borderRadius:"3px", transition:"width 0.3s" }}/>
        </div>
      </div>
      <div style={{ padding:"20px 16px 32px", maxWidth:"520px", margin:"0 auto" }}>
        <div style={{ background:"#fff", border:"1px solid #E5E7EB", borderRadius:"12px", padding:"13px 16px", marginBottom:"20px", textAlign:"center" }}>
          <p style={{ margin:0, fontSize:"13px", color:"#374151", lineHeight:"1.7" }}>
            {t.qInstruct}&nbsp;
            <span style={{ color:"#DC2626", fontWeight:"700" }}>{t.qMost}</span>&nbsp;
            {t.qAnd}&nbsp;
            <span style={{ color:"#2563EB", fontWeight:"700" }}>{t.qLeast}</span>
            {t.qInstructEnd ? <>&nbsp;{t.qInstructEnd}</> : null}
          </p>
        </div>
        <div style={{ display:"flex", flexDirection:"column", gap:"10px", marginBottom:"28px" }}>
          {q.phrases.map((p,i)=>{
            const isMost=ans.most===i, isLeast=ans.least===i;
            return (
              <div key={i} style={{ background:"#fff", border:`2px solid ${isMost?"#DC2626":isLeast?"#2563EB":"#E5E7EB"}`, borderRadius:"12px", padding:"14px", transition:"border-color 0.15s" }}>
                <p style={{ margin:"0 0 3px 0", fontSize:"15px", fontWeight:"600", color:"#111827" }}>{p[lang]}</p>
                <p style={{ margin:"0 0 11px 0", fontSize:"11px", color:"#9CA3AF", fontStyle:"italic" }}>{lang==="zh" ? p.en : p.zh}</p>
                <div style={{ display:"flex", gap:"8px" }}>
                  {[["most","#DC2626"],["least","#2563EB"]].map(([type,col])=>{
                    const active = type==="most" ? isMost : isLeast;
                    const label  = type==="most" ? t.most  : t.least;
                    return (
                      <button key={type} onClick={()=>onPick(type,i)} style={{
                        flex:1, padding:"8px 4px", borderRadius:"8px",
                        border:`1.5px solid ${active?col:"#E5E7EB"}`,
                        background:active?col:"#fff", color:active?"#fff":"#9CA3AF",
                        fontSize:"12px", fontWeight:"600", cursor:"pointer", transition:"all 0.15s",
                      }}>{active ? `✓ ${label}` : label}</button>
                    );
                  })}
                </div>
              </div>
            );
          })}
        </div>
        <div style={{ display:"flex", gap:"10px" }}>
          {num>1 && <button onClick={onPrev} style={{ flex:1, padding:"14px", borderRadius:"12px", border:"2px solid #E5E7EB", background:"#fff", color:"#374151", fontSize:"14px", fontWeight:"600", cursor:"pointer" }}>{t.prevQ}</button>}
          <button onClick={onNext} style={{ flex:2, padding:"14px", borderRadius:"12px", border:"none", background:"linear-gradient(135deg,#DC2626,#B91C1C)", color:"#fff", fontSize:"14px", fontWeight:"700", cursor:"pointer" }}>
            {isLast ? t.lastQ : t.nextQ}
          </button>
        </div>
      </div>
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════════
// SCREEN: Report
// ═══════════════════════════════════════════════════════════════════
function Report({ t, lang, info, scores, primary, secondary, onRestart, onShare, onShareWA, onCopy, onPrint, showShare, setShowShare, copied }) {
  const P  = PROFILES[primary];
  const S2 = PROFILES[secondary];
  const ck = `${primary}${secondary}`;
  const combo = (COMBO[ck]||COMBO[`${secondary}${primary}`]||{})[lang]||"";
  const normPct = d => Math.round(scores.M[d]/24*100);
  const resultText = `${P.label[lang]} / ${S2.label[lang]}`;

  const waUrl = () => {
    const url = window.location.href;
    const msg = lang==="zh"
      ? `我刚完成了 DISC 行为风格测评！\n我的类型：${resultText}\n\n想了解你的类型吗？点击链接：\n${url}`
      : `I just completed the DISC Behavioural Style Assessment!\nMy type: ${resultText}\n\nFind out yours here:\n${url}`;
    return `https://wa.me/?text=${encodeURIComponent(msg)}`;
  };

  const btnStyle = {
    width:"100%", display:"flex", alignItems:"center", padding:"14px 16px",
    background:"#F9FAFB", border:"1.5px solid #E5E7EB", borderRadius:"12px",
    marginBottom:"10px", cursor:"pointer", textAlign:"left", textDecoration:"none", color:"inherit",
  };

  return (
    <div style={{ ...St.page, background:"#F3F4F6" }}>
      {/* Hero */}
      <div style={{ background:`linear-gradient(140deg,${P.color}f0,${P.color}88)`, padding:"36px 20px 44px", position:"relative", overflow:"hidden" }}>
        <div style={{ position:"absolute", top:"-10px", right:"-10px", fontSize:"130px", opacity:0.12, userSelect:"none" }}>{P.emoji}</div>
        <p style={{ color:"rgba(255,255,255,0.7)", fontSize:"11px", margin:"0 0 6px 0", letterSpacing:"1px" }}>{t.reportLabel}</p>
        <h1 style={{ color:"#fff", fontSize:"26px", fontWeight:"900", margin:"0 0 4px 0" }}>{info.name}</h1>
        <p style={{ color:"rgba(255,255,255,0.65)", fontSize:"13px", margin:"0 0 20px 0" }}>
          {info.gender} · {info.age} {t.yrs} · {info.marital} · {info.edu}
        </p>
        <div style={{ display:"inline-block", background:"rgba(255,255,255,0.18)", borderRadius:"50px", padding:"10px 22px", marginBottom:"10px" }}>
          <span style={{ color:"#fff", fontSize:"20px", fontWeight:"900" }}>{P.label[lang]} / {S2.label[lang]}</span>
          <span style={{ color:"rgba(255,255,255,0.75)", fontSize:"12px", marginLeft:"8px" }}>{t.primary} · {t.secondary}</span>
        </div>
        <p style={{ color:"rgba(255,255,255,0.85)", fontSize:"14px", margin:"8px 0 0 0", fontStyle:"italic" }}>{P.tagline[lang]}</p>
      </div>

      <div style={{ maxWidth:"520px", margin:"0 auto", padding:"0 14px 40px" }}>
        {/* Score chart */}
        <div style={{ ...St.card, marginTop:"14px" }}>
          <h3 style={{ fontSize:"15px", fontWeight:"700", color:"#111827", margin:"0 0 16px 0" }}>{t.chartTitle}</h3>
          {["D","I","S","C"].map(d=>{
            const pr=PROFILES[d], pc=normPct(d);
            return (
              <div key={d} style={{ marginBottom:"14px" }}>
                <div style={{ display:"flex", justifyContent:"space-between", marginBottom:"5px" }}>
                  <span style={{ fontSize:"14px", fontWeight:d===primary?"800":"500", color:d===primary?pr.color:"#374151" }}>
                    {d} {pr.full[lang]}{d===primary?" ⭐":d===secondary?" ·":""}
                  </span>
                  <span style={{ fontSize:"12px", color:"#6B7280" }}>{scores.M[d]}/24 ({pc}%)</span>
                </div>
                <div style={{ height:"10px", background:"#F3F4F6", borderRadius:"5px" }}>
                  <div style={{ height:"100%", width:`${pc}%`, background:pr.color, borderRadius:"5px" }}/>
                </div>
              </div>
            );
          })}
          <p style={{ fontSize:"11px", color:"#9CA3AF", margin:"10px 0 0 0", textAlign:"center" }}>{t.chartNote}</p>
        </div>

        {/* Combined type */}
        {combo && (
          <div style={{ ...St.card, borderLeft:`4px solid ${P.color}` }}>
            <h3 style={{ fontSize:"15px", fontWeight:"700", color:"#111827", margin:"0 0 10px 0" }}>{t.comboTitle}{primary}/{secondary}{t.comboSuffix}</h3>
            <p style={{ fontSize:"14px", color:"#374151", lineHeight:"1.75", margin:0 }}>{combo}</p>
          </div>
        )}

        {/* Personality */}
        <div style={{ ...St.card, borderTop:`3px solid ${P.color}` }}>
          <div style={{ display:"flex", alignItems:"center", marginBottom:"10px" }}>
            <span style={{ fontSize:"24px", marginRight:"10px" }}>{P.emoji}</span>
            <div>
              <h3 style={{ fontSize:"15px", fontWeight:"800", color:P.color, margin:0 }}>{P.label[lang]} — {t.traitTitle}</h3>
              <p style={{ fontSize:"12px", color:"#6B7280", margin:"2px 0 0 0" }}>{P.core[lang]}</p>
            </div>
          </div>
          <p style={{ fontSize:"14px", color:"#374151", lineHeight:"1.8", margin:0 }}>{P.desc[lang]}</p>
        </div>

        {/* Strengths */}
        <div style={St.card}>
          <h3 style={{ fontSize:"15px", fontWeight:"700", color:"#111827", margin:"0 0 14px 0" }}>{t.strengthTitle}</h3>
          {P.strengths[lang].map((s,i)=>(
            <div key={i} style={{ display:"flex", alignItems:"flex-start", marginBottom:"9px" }}>
              <div style={St.dot(P.color)}/><span style={{ fontSize:"14px", color:"#374151" }}>{s}</span>
            </div>
          ))}
        </div>

        {/* Growth */}
        <div style={St.card}>
          <h3 style={{ fontSize:"15px", fontWeight:"700", color:"#111827", margin:"0 0 14px 0" }}>{t.growthTitle}</h3>
          {P.growth[lang].map((g,i)=>(
            <div key={i} style={{ display:"flex", alignItems:"flex-start", marginBottom:"9px" }}>
              <div style={St.dot("#9CA3AF")}/><span style={{ fontSize:"14px", color:"#374151" }}>{g}</span>
            </div>
          ))}
        </div>

        {/* Work partners */}
        <div style={St.card}>
          <h3 style={{ fontSize:"15px", fontWeight:"700", color:"#111827", margin:"0 0 12px 0" }}>{t.workTitle}</h3>
          <div style={{ marginBottom:"12px" }}>
            {P.work_best[lang].map((w,i)=>{
              const key = lang==="zh" ? w[0] : w.split(" ")[1]; // "S" from "S 型" or "Type S"
              const pr  = PROFILES[key] || PROFILES["D"];
              return <span key={i} style={St.tag(pr.color,pr.light)}>{w}</span>;
            })}
          </div>
          <p style={{ fontSize:"14px", color:"#374151", lineHeight:"1.75", margin:0 }}>{P.work_desc[lang]}</p>
        </div>

        {/* Careers */}
        <div style={St.card}>
          <h3 style={{ fontSize:"15px", fontWeight:"700", color:"#111827", margin:"0 0 12px 0" }}>{t.careerTitle}</h3>
          <div style={{ display:"flex", flexWrap:"wrap" }}>
            {P.careers[lang].map((c,i)=>(
              <span key={i} style={St.tag(P.color,P.light)}>{c}</span>
            ))}
          </div>
        </div>

        {/* Romance */}
        <div style={St.card}>
          <h3 style={{ fontSize:"15px", fontWeight:"700", color:"#111827", margin:"0 0 12px 0" }}>{t.romanceTitle}</h3>
          <div style={{ marginBottom:"12px" }}>
            {P.romance_compat[lang].map((r,i)=>{
              const key = lang==="zh" ? r[0] : r.split(" ")[1];
              const pr  = PROFILES[key] || PROFILES["D"];
              return <span key={i} style={St.tag(pr.color,pr.light)}>{r}</span>;
            })}
          </div>
          <p style={{ fontSize:"14px", color:"#374151", lineHeight:"1.75", margin:0 }}>{P.romance_desc[lang]}</p>
        </div>

        {/* Other types */}
        <div style={St.card}>
          <h3 style={{ fontSize:"15px", fontWeight:"700", color:"#111827", margin:"0 0 14px 0" }}>{t.othersTitle}</h3>
          {["D","I","S","C"].filter(d=>d!==primary).map(d=>{
            const pr=PROFILES[d];
            return (
              <div key={d} style={{ display:"flex", alignItems:"flex-start", marginBottom:"12px", paddingBottom:"12px", borderBottom:"1px solid #F3F4F6" }}>
                <div style={{ width:"36px", height:"36px", borderRadius:"10px", background:pr.light, display:"flex", alignItems:"center", justifyContent:"center", marginRight:"12px", flexShrink:0 }}>
                  <span style={{ fontSize:"16px", fontWeight:"900", color:pr.color }}>{d}</span>
                </div>
                <div>
                  <p style={{ fontSize:"13px", fontWeight:"700", color:pr.color, margin:"0 0 2px 0" }}>{pr.full[lang]}</p>
                  <p style={{ fontSize:"13px", color:"#6B7280", margin:0, lineHeight:"1.5" }}>{pr.tagline[lang]}</p>
                </div>
              </div>
            );
          })}
        </div>

        {/* Disclaimer */}
        <div style={{ background:"#F9FAFB", border:"1px solid #E5E7EB", borderRadius:"12px", padding:"14px 16px", marginBottom:"16px" }}>
          <p style={{ fontSize:"11px", color:"#9CA3AF", lineHeight:"1.65", margin:0, textAlign:"center" }}>{t.disclaimer}</p>
        </div>

        {/* Action buttons */}
        <div className="no-print">
          <button onClick={onShare} style={{ ...St.btn(`linear-gradient(135deg,${P.color},${P.color}cc)`) }}>
            📤 {lang==="zh" ? "分享 / 保存报告" : "Share / Save Report"}
          </button>
          <button onClick={onRestart} style={{ ...St.btn("#fff","#374151"), border:"2px solid #E5E7EB" }}>{t.restartBtn}</button>
        </div>
      </div>

      {/* Share sheet overlay */}
      {showShare && (
        <div className="no-print" style={{ position:"fixed", inset:0, background:"rgba(0,0,0,0.5)", zIndex:100, display:"flex", alignItems:"flex-end", justifyContent:"center" }}
          onClick={()=>setShowShare(false)}>
          <div style={{ background:"#fff", borderRadius:"20px 20px 0 0", padding:"20px 16px 36px", width:"100%", maxWidth:"480px" }}
            onClick={e=>e.stopPropagation()}>
            <div style={{ width:"40px", height:"4px", background:"#E5E7EB", borderRadius:"2px", margin:"0 auto 20px" }}/>
            <h3 style={{ fontSize:"16px", fontWeight:"700", color:"#111827", margin:"0 0 16px 0", textAlign:"center" }}>
              {lang==="zh" ? "分享或保存" : "Share or Save"}
            </h3>
            {/* WhatsApp — must be <a> tag to avoid popup blocker */}
            <a href={waUrl()} target="_blank" rel="noopener noreferrer"
              onClick={()=>setShowShare(false)}
              style={btnStyle}>
              <span style={{ fontSize:"24px", marginRight:"14px" }}>💬</span>
              <div>
                <div style={{ fontSize:"15px", fontWeight:"700", color:"#111827" }}>{lang==="zh" ? "WhatsApp 分享" : "Share via WhatsApp"}</div>
                <div style={{ fontSize:"12px", color:"#9CA3AF", marginTop:"2px" }}>{lang==="zh" ? "分享结果与测评链接" : "Send your result and assessment link"}</div>
              </div>
            </a>

            {/* Copy link */}
            <button onClick={onCopy} style={btnStyle}>
              <span style={{ fontSize:"24px", marginRight:"14px" }}>🔗</span>
              <div>
                <div style={{ fontSize:"15px", fontWeight:"700", color:"#111827" }}>{copied ? (lang==="zh"?"✅ 已复制！":"✅ Copied!") : (lang==="zh"?"复制链接":"Copy Link")}</div>
                <div style={{ fontSize:"12px", color:"#9CA3AF", marginTop:"2px" }}>{lang==="zh" ? "复制测评网址到剪贴板" : "Copy the assessment URL to clipboard"}</div>
              </div>
            </button>

            {/* Save / Print */}
            <button onClick={onPrint} style={btnStyle}>
              <span style={{ fontSize:"24px", marginRight:"14px" }}>📄</span>
              <div>
                <div style={{ fontSize:"15px", fontWeight:"700", color:"#111827" }}>{lang==="zh" ? "保存 / 打印报告" : "Save / Print Report"}</div>
                <div style={{ fontSize:"12px", color:"#9CA3AF", marginTop:"2px" }}>{lang==="zh" ? "另存为 PDF 或打印" : "Save as PDF or print"}</div>
              </div>
            </button>
            <button onClick={()=>setShowShare(false)} style={{ ...St.btn("#F3F4F6","#6B7280"), marginTop:"4px", border:"none" }}>
              {lang==="zh" ? "取消" : "Cancel"}
            </button>
          </div>
        </div>
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<DISCApp />);
